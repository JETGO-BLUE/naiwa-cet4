<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奶娃过四级</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2328;
      --sub: #6b7280;
      --accent: #e53935;
      --accent-soft: #fdecea;
      --green: #2e7d32;
      --green-soft: #e6f4ea;
      --border: #e5e7eb;
      --tag: #eef2ff;
      --tag-text: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 420px;
      min-height: 300px;
      max-height: 580px;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      font-size: 14px;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--card);
      padding: 11px 16px 10px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    header h1 .logo { color: var(--accent); font-size: 18px; }
    header h1 .logo-img {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      object-fit: cover;
      display: inline-block;
    }
    .video-title {
      font-size: 12px;
      color: var(--sub);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 采集状态条：一个小圆点 + 一句人话，抓不到词时能看出卡在哪一步 */
    .cap-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      line-height: 15px;
      height: 15px;
      color: var(--sub);
      margin-top: 3px;
      overflow: hidden;
    }
    .cap-status i {
      flex-shrink: 0;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9aa3b2;
    }
    .cap-status span {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cap-status[data-state="collecting"] i,
    .cap-status[data-state="saved"] i { background: #43a047; }
    .cap-status[data-state="waiting"] i { background: #e0a044; }
    .cap-status[data-state="no_captions"] i,
    .cap-status[data-state="error"] i { background: #e0a044; }
    .cap-status[data-state="hidden"] { display: none; }
    .tabs {
      display: flex;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      font-size: 13px;
      color: var(--sub);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      user-select: none;
    }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }
    /* 诊断入口：贴在 tab 行最右边 */
    .diag-btn {
      flex: 0 0 40px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: var(--card);
      color: var(--sub);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
    }
    .diag-btn:hover { color: var(--accent); }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .toolbar input {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .toolbar input:focus { border-color: var(--accent); }
    .btn {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #c62828; }
    .btn-ghost { background: var(--tag); color: var(--tag-text); }
    .btn-ghost:hover { background: #e0e7ff; }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      min-height: 0;
    }
    /* 三个 tab 页本身也必须是 flex 容器，否则里面 .content 的 flex:1 根本不起作用，
       内容一高就把底部的牌堆按钮顶出弹窗（这个坑之前一直存在，被状态条挤出来了） */
    #tab-current,
    #tab-history,
    #tab-familiar {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    /* 卡片模式下，内容区不再自己滚动，交给牌堆自己管 */
    #currentContent.deck-mode {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .stats {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--sub);
    }
    .stat b { color: var(--text); font-size: 15px; margin-right: 2px; }
    .empty {
      text-align: center;
      color: var(--sub);
      padding: 40px 20px;
      font-size: 13px;
      line-height: 1.7;
    }
    .empty .icon { font-size: 32px; margin-bottom: 8px; }
    .familiar-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .familiar-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 12px;
      padding: 4px 8px 4px 10px;
      border-radius: 14px;
    }
    .familiar-item .undo {
      cursor: pointer;
      font-weight: 700;
      color: var(--green);
      opacity: 0.6;
    }
    .familiar-item .undo:hover { opacity: 1; }
    .video-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .video-item:hover { border-color: var(--accent); }
    .video-item .v-row { display: flex; align-items: flex-start; gap: 8px; }
    .video-item .v-title {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .video-del {
      flex-shrink: 0;
      font-family: inherit;
      font-size: 12px;
      line-height: 1;
      padding: 3px 7px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--sub);
      cursor: pointer;
      transition: border-color .12s, color .12s;
    }
    .video-del:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .video-del:disabled { opacity: .45; cursor: default; }
    .video-item .v-meta { font-size: 12px; color: var(--sub); margin-top: 3px; }
    .muted { color: var(--sub); font-size: 12px; }

    /* 时间点标签（可点：回看视频那一处） */
    .time-tag {
      background: var(--tag);
      color: var(--tag-text);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-family: monospace;
      cursor: pointer;
      user-select: none;
      transition: background .12s, color .12s, transform .12s;
    }
    .time-tag::before {
      content: "▶";
      font-size: 7px;
      margin-right: 3px;
      vertical-align: 1px;
      opacity: .5;
    }
    .time-tag:hover {
      background: var(--green-soft);
      color: var(--green);
    }
    .time-tag:hover::before { opacity: 1; }
    .time-tag:active { transform: scale(.94); }
    /* 点击后 700ms 的即时反馈 */
    .time-tag.seeked { background: var(--green); color: #fff; }
    .time-tag.seek-fail { background: #edcccc; color: #a87272; }

    .slash-btn {
      flex-shrink: 0;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--sub);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .slash-btn:hover { border-color: var(--green); color: var(--green); }
    .slash-btn.slashed {
      background: var(--green-soft);
      color: var(--green);
      border-color: var(--green);
    }

    /* 详情面板（点击单词弹出） */
    .detail-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .detail-panel.open { display: flex; }
    .detail-box {
      background: var(--card);
      width: 92%;
      max-height: 88%;
      overflow-y: auto;
      border-radius: 12px;
      padding: 16px;
    }
    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .detail-word {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
    }
    .detail-phonetic {
      font-size: 13px;
      color: var(--sub);
      margin-left: 8px;
      font-weight: 400;
    }
    .detail-close {
      cursor: pointer;
      font-size: 20px;
      color: var(--sub);
      background: none;
      border: none;
    }
    .detail-close:hover { color: var(--accent); }
    .detail-lemma {
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 10px;
    }
    .detail-section { margin-bottom: 12px; }
    .detail-section h4 {
      font-size: 12px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .pos-block { margin-bottom: 8px; }
    .pos-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--tag-text);
      background: var(--tag);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .def-item {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 4px;
      padding-left: 4px;
    }
    .def-item .ex {
      color: var(--sub);
      font-size: 12px;
      font-style: italic;
      display: block;
      margin-top: 2px;
    }
    .syn-ant {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .syn-chip { background: var(--green-soft); color: var(--green); font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .ant-chip { background: var(--accent-soft); color: var(--accent); font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .cog-chip {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--tag-text);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .detail-loading { text-align: center; color: var(--sub); padding: 20px; }
    .detail-error { text-align: center; color: var(--accent); padding: 16px; font-size: 13px; }
    /* 单词变形（标签 + 词形本体） */
    .infl-list { display: flex; flex-direction: column; gap: 6px; }
    .infl-row { display: flex; align-items: baseline; gap: 10px; }
    .infl-label {
      flex-shrink: 0;
      min-width: 74px;
      font-size: 12px;
      color: var(--sub);
    }
    .infl-word {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", sans-serif;
    }
    /* ===== 词库切换小弹窗（点「四级 ▾」向下弹出） ===== */
    .dict-pop {
      position: fixed;
      z-index: 120;
      width: 236px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .16);
      padding: 6px;
      font-size: 12.5px;
    }
    .dict-pop[hidden] { display: none; }
    .dict-pop-head { font-size: 11px; color: var(--sub); padding: 3px 7px 6px; }
    /* 学习方式（普通/测试）选择器，放在词库弹层顶部 */
    .mode-setting {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 7px 8px;
      font-size: 12px;
      color: var(--sub);
    }
    .mode-setting select {
      font-family: inherit;
      font-size: 12px;
      padding: 3px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }
    /* 普通模式：卡片上直接显示释义，不出题 */
    .normal-meaning {
      margin-top: 16px;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
    }
    .dict-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 7px;
      border-radius: 6px;
      cursor: pointer;
    }
    .dict-item:hover { background: var(--bg); }
    .dict-item.active { background: var(--tag); }
    .dict-item .di-tick {
      flex: 0 0 11px;
      color: var(--accent);
      font-weight: 700;
      font-size: 11px;
    }
    .dict-item .di-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dict-item .di-name em {
      font-style: normal;
      font-size: 10px;
      color: var(--sub);
      margin-left: 3px;
    }
    .dict-item .di-count { flex-shrink: 0; font-size: 11px; color: var(--sub); font-family: monospace; }
    .dict-item .di-del {
      flex-shrink: 0;
      border: 0;
      background: none;
      color: var(--sub);
      font-size: 12px;
      line-height: 1;
      padding: 0 2px;
      cursor: pointer;
    }
    .dict-item .di-del:hover { color: var(--accent); }
    .dict-pop-sep { height: 1px; background: var(--border); margin: 6px 2px; }
    .dict-import {
      width: 100%;
      text-align: left;
      padding: 7px;
      border: 0;
      border-radius: 6px;
      background: none;
      color: var(--tag-text);
      font-family: inherit;
      font-size: 12.5px;
      cursor: pointer;
    }
    .dict-import:hover { background: var(--tag); }
    .dict-src {
      display: block;
      padding: 4px 7px 2px;
      font-size: 11px;
      color: var(--sub);
      text-decoration: none;
    }
    .dict-src:hover { color: var(--accent); }

    /* 诊断面板里的键值行 */
    .diag-sec { margin-bottom: 6px; }
    .diag-sec h4 {
      font-size: 11px;
      color: var(--sub);
      letter-spacing: .5px;
      margin: 14px 0 4px;
      text-transform: uppercase;
    }
    .diag-sec h4:first-child { margin-top: 0; }
    .diag-row { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.65; }
    .diag-row > b {
      flex: 0 0 92px;
      color: var(--sub);
      font-weight: 400;
    }
    .diag-row > span { flex: 1; min-width: 0; word-break: break-word; }
    .diag-ok { color: var(--green); }
    .diag-bad { color: var(--accent); }

    /* ===== 四选一题目本体（卡片和演示页共用） ===== */
    .quiz-host { margin-top: 9px; }
    .quiz { display: flex; flex-direction: column; gap: 6px; }
    .opt {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: 12.8px;
      line-height: 1.42;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }
    .opt:hover:not(:disabled) { border-color: var(--accent); background: #fffafa; }
    .opt:disabled { cursor: default; }
    .opt .idx {
      flex-shrink: 0;
      width: 17px;
      height: 17px;
      line-height: 17px;
      text-align: center;
      border-radius: 4px;
      background: var(--tag);
      color: var(--tag-text);
      font-size: 10.5px;
      font-weight: 700;
    }
    .opt .txt { flex: 1; min-width: 0; }
    .opt .mark { flex-shrink: 0; font-size: 13px; }
    .opt.wrong { border-color: #edcccc; background: #fdf4f4; }
    .opt.wrong .txt { text-decoration: line-through; color: #a87272; }
    .opt.wrong .idx { background: var(--accent-soft); color: #c62828; }
    .opt.correct { border-color: var(--green); background: var(--green-soft); }
    .opt.correct .idx { background: #cfe8d5; color: var(--green); }
    .answer-reveal {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 6px;
      background: var(--green-soft);
      border: 1px solid #cfe8d5;
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 12px;
      line-height: 1.4;
      color: #1b5e20;
      cursor: pointer;
      text-align: left;
    }
    .answer-reveal:hover { border-color: var(--green); }
    .answer-reveal .more { margin-left: auto; font-size: 11px; opacity: 0.75; white-space: nowrap; }
    .quiz-loading { font-size: 12px; color: var(--sub); padding: 6px 0; }
    .quiz-tip { font-size: 11px; color: var(--sub); margin-top: 6px; }
    /* 答对那一行：释义条 + 「下一题」（挤在一行，省出卡片高度） */
    .quiz-done {
      display: flex;
      align-items: stretch;
      gap: 7px;
      margin-top: 8px;
    }
    .quiz-done .quiz-next {
      flex-shrink: 0;
      padding: 0 12px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--tag-text);
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }
    .quiz-done .quiz-next:hover { border-color: var(--tag-text); background: var(--tag); }
    .quiz-done .quiz-next:active { transform: scale(.97); }
    .mini-btn {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--sub);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .mini-btn:hover { border-color: var(--tag-text); color: var(--tag-text); }
    .spk { font-size: 12px; opacity: 0.5; margin-left: 5px; }

    /* ===== 卡片牌堆（一次只显示一个单词题） ===== */
    .deck {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 0;
    }
    .deck-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 6px;
    }
    .deck-count b { color: var(--text); font-size: 15px; }
    .deck-stat b { color: var(--text); }
    /* 词库小标签：贴在「第 n / N 题」右边，平时就两个字，不占地方 */
    .dict-chip {
      margin-left: 6px;
      padding: 1px 6px 1px 7px;
      font-family: inherit;
      font-size: 11px;
      line-height: 16px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--tag-text);
      cursor: pointer;
      vertical-align: 1px;
      white-space: nowrap;
    }
    .dict-chip:hover { border-color: var(--tag-text); background: var(--tag); }
    .dict-chip.open { border-color: var(--tag-text); background: var(--tag); }
    .dict-chip i { font-style: normal; font-size: 9px; opacity: .6; margin-left: 1px; }
    .empty-dict { margin-top: 16px; }
    .empty-dict .dict-chip { margin-left: 0; font-size: 12px; padding: 3px 9px; }
    .deck-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .deck-bar > i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 2px;
      transition: width .25s ease;
    }
    .deck-stage {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }
    .deck-track {
      display: flex;
      height: 100%;
      transition: transform .28s cubic-bezier(.4, 0, .2, 1);
      will-change: transform;
    }
    .deck-card {
      flex: 0 0 100%;
      width: 100%;
      min-width: 0;
      overflow-y: auto;
      padding: 0 2px 2px;
    }
    .dc-inner {
      min-height: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .06);
      padding: 14px;
      display: flex;
      flex-direction: column;
    }
    .deck-card.solved .dc-inner { border-color: #cfe8d5; }
    .dc-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .dc-word {
      font-size: 23px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--text);
      cursor: pointer;
      word-break: break-word;
    }
    .dc-word:hover { color: var(--accent); }
    .dc-lemma {
      font-size: 11px;
      font-weight: 400;
      color: #9ca3af;
      margin-left: 5px;
    }
    .dc-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .dc-times {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
    }
    .dc-times-label {
      font-size: 11px;
      color: var(--sub);
      margin-right: 3px;
    }
    .deck-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px 12px;
      flex-shrink: 0;
      background: var(--bg);
    }
    .deck-btn {
      flex: 1;
      padding: 9px 0;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: background .12s, border-color .12s, color .12s, opacity .12s;
    }
    .deck-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .deck-btn:active:not(:disabled) { transform: scale(.97); }
    .deck-btn:disabled { opacity: .38; cursor: default; }
    .deck-pos {
      flex-shrink: 0;
      min-width: 52px;
      text-align: center;
      font-size: 12px;
      color: var(--sub);
      font-family: monospace;
    }
    .deck-pos b { color: var(--text); font-size: 14px; }
    .deck-done {
      margin: 0 16px 10px;
      text-align: center;
      font-size: 12px;
      color: var(--green);
      background: var(--green-soft);
      border: 1px solid #cfe8d5;
      border-radius: 8px;
      padding: 7px 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1><img src="icons/icon48.png" class="logo-img" alt="" />奶娃过四级</h1>
    <div class="video-title" id="videoTitle">尚未捕获视频</div>
    <div class="cap-status" id="capStatus" data-state="idle">
      <i></i><span id="capStatusText">等待字幕状态</span>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="current">当前视频</div>
    <div class="tab" data-tab="history">历史记录</div>
    <div class="tab" data-tab="familiar">已斩词</div>
    <button type="button" class="diag-btn" id="diagBtn" title="诊断信息：卡在哪一步、计时、字幕容器状态" aria-label="诊断信息">ⓘ</button>
  </div>

  <!-- 当前视频 tab -->
  <div id="tab-current">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="搜索单词或释义..." />
      <button class="btn btn-primary" id="recaptureBtn">重新抓取</button>
    </div>
    <div class="content" id="currentContent"></div>
  </div>

  <!-- 历史 tab -->
  <div id="tab-history" style="display:none;">
    <div class="content" id="historyContent"></div>
  </div>

  <!-- 已斩词 tab -->
  <div id="tab-familiar" style="display:none;">
    <div class="toolbar">
      <button class="btn btn-ghost" id="clearFamiliarBtn">清空所有斩词</button>
    </div>
    <div class="content" id="familiarContent"></div>
  </div>

  <!-- 单词详情弹窗 -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-box" id="detailBox"></div>
  </div>

  <!-- 诊断面板 -->
  <div class="detail-panel" id="diagPanel">
    <div class="detail-box">
      <div class="detail-head">
        <strong>字幕与弹窗诊断</strong>
        <button class="detail-close" id="diagClose" aria-label="关闭诊断">✕</button>
      </div>
      <div id="diagBody"></div>
    </div>
  </div>

  <!-- 词库切换小弹窗（点「四级 ▾」向下弹出） -->
  <div class="dict-pop" id="dictPop" hidden>
    <label class="mode-setting">学习方式
      <select id="learningModeSelect">
        <option value="quiz" selected>测试模式（四选一）</option>
        <option value="normal">普通模式（直接看释义）</option>
      </select>
    </label>
    <div class="dict-pop-head">选择词库（当前视频按词库筛选）</div>
    <div id="dictList"></div>
    <div class="dict-pop-sep"></div>
    <button type="button" class="dict-import" id="dictImportBtn">＋ 导入我的词表（JSON / CSV / TXT）</button>
    <a href="#" class="dict-src" id="dictSrcLink">词表来源与许可 →</a>
  </div>
  <input type="file" id="dictFile" accept=".json,.csv,.tsv,.txt,application/json,text/plain,text/csv" hidden />

  <script src="popup.js"></script>
</body>
</html>
