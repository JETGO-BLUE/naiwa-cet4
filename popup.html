<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奶娃过四级</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2328;
      --sub: #6b7280;
      --accent: #e53935;
      --accent-soft: #fdecea;
      --green: #2e7d32;
      --green-soft: #e6f4ea;
      --border: #e5e7eb;
      --tag: #eef2ff;
      --tag-text: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 420px;
      min-height: 300px;
      max-height: 580px;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--card);
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    header h1 .logo { color: var(--accent); font-size: 18px; }
    header h1 .logo-img {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      object-fit: cover;
      display: inline-block;
    }
    .video-title {
      font-size: 12px;
      color: var(--sub);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .capture-status {
      font-size: 11px;
      color: var(--sub);
      margin-top: 5px;
      min-height: 16px;
      line-height: 1.4;
      max-height: 34px;
      overflow: hidden;
    }
    .capture-status.error { color: var(--accent); }
    .perf-diagnostics {
      font-size: 11px;
      color: var(--sub);
      margin-top: 5px;
    }
    .perf-diagnostics summary { cursor: pointer; user-select: none; }
    .perf-diagnostics-content { line-height: 1.6; padding: 4px 0 0 10px; }
    .tabs {
      display: flex;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .vocabulary-picker { padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--border); }
    .vocabulary-row { display: flex; align-items: center; gap: 10px; }
    .vocabulary-row label { font-size: 13px; font-weight: 600; }
    .vocabulary-row select { flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: white; color: var(--text); }
    .vocabulary-row a { font-size: 11px; color: var(--sub); }
    .vocabulary-status { font-size: 11px; color: var(--sub); margin-top: 6px; line-height: 1.5; }
    .vocabulary-status.error { color: var(--accent); }
    .vocabulary-tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
    .vocabulary-tag { font-size: 10px; line-height: 1.4; font-weight: 500; padding: 1px 5px; border-radius: 4px; }
    .vocabulary-tag.cet4 { color: #2e7d32; background: #e6f4ea; }
    .vocabulary-tag.cet6 { color: #4f46e5; background: #eef2ff; }
    .vocabulary-tag.ielts { color: #9a5400; background: #fff3db; }
    .legacy-note { font-size: 12px; color: var(--sub); line-height: 1.5; margin-bottom: 10px; }
    .familiar-item .vocabulary-tags { margin: 0; }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      font-size: 13px;
      color: var(--sub);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      user-select: none;
    }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .toolbar input {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .toolbar input:focus { border-color: var(--accent); }
    .btn {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #c62828; }
    .btn-ghost { background: var(--tag); color: var(--tag-text); }
    .btn-ghost:hover { background: #e0e7ff; }
    header, .vocabulary-picker, .tabs, .toolbar { flex-shrink: 0; }
    #tab-current, #tab-history, #tab-familiar { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 16px;
    }
    .stats {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--sub);
    }
    .stat b { color: var(--text); font-size: 15px; margin-right: 2px; }
    .word-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      transition: opacity 0.15s;
    }
    .word-card.slashed { opacity: 0.4; }
    .word-card.slashed .word-text { text-decoration: line-through; }
    .word-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .word-left { flex: 1; min-width: 0; }
    .word-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .word-meaning {
      font-size: 12px;
      color: var(--sub);
      margin-top: 2px;
    }
    .times {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .time-tag {
      background: var(--tag);
      color: var(--tag-text);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-family: monospace;
    }
    .slash-btn {
      flex-shrink: 0;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--sub);
      cursor: pointer;
    }
    .slash-btn:hover { border-color: var(--green); color: var(--green); }
    .slash-btn.slashed {
      background: var(--green-soft);
      color: var(--green);
      border-color: var(--green);
    }
    .empty {
      text-align: center;
      color: var(--sub);
      padding: 40px 20px;
      font-size: 13px;
      line-height: 1.7;
    }
    .empty .icon { font-size: 32px; margin-bottom: 8px; }
    .familiar-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .familiar-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 12px;
      padding: 4px 8px 4px 10px;
      border-radius: 14px;
    }
    .familiar-item .undo {
      cursor: pointer;
      font-weight: 700;
      color: var(--green);
      opacity: 0.6;
    }
    .familiar-item .undo:hover { opacity: 1; }
    .video-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .video-item:hover { border-color: var(--accent); }
    .video-item .v-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .video-item .v-meta { font-size: 12px; color: var(--sub); margin-top: 3px; }
    .muted { color: var(--sub); font-size: 12px; }
    /* 单词可点击提示 */
    .word-text { cursor: pointer; }
    .word-text:hover { color: var(--accent); }
    .word-hint { font-size: 10px; color: #9ca3af; font-weight: 400; margin-left: 2px; }
    /* 详情面板（点击单词弹出） */
    .detail-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .detail-panel.open { display: flex; }
    .detail-box {
      background: var(--card);
      width: 92%;
      max-height: 88%;
      overflow-y: auto;
      border-radius: 12px;
      padding: 16px;
    }
    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .detail-word {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
    }
    .detail-phonetic {
      font-size: 13px;
      color: var(--sub);
      margin-left: 8px;
      font-weight: 400;
    }
    .detail-close {
      cursor: pointer;
      font-size: 20px;
      color: var(--sub);
      background: none;
      border: none;
    }
    .detail-close:hover { color: var(--accent); }
    .detail-lemma {
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 10px;
    }
    .detail-section { margin-bottom: 12px; }
    .detail-section h4 {
      font-size: 12px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .pos-block { margin-bottom: 8px; }
    .pos-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--tag-text);
      background: var(--tag);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .def-item {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 4px;
      padding-left: 4px;
    }
    .def-item .ex {
      color: var(--sub);
      font-size: 12px;
      font-style: italic;
      display: block;
      margin-top: 2px;
    }
    .syn-ant {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .syn-chip { background: var(--green-soft); color: var(--green); font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .ant-chip { background: var(--accent-soft); color: var(--accent); font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .cog-chip {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--tag-text);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .detail-loading { text-align: center; color: var(--sub); padding: 20px; }
    .detail-error { text-align: center; color: var(--accent); padding: 16px; font-size: 13px; }
    /* 单词变形（百词斩式：标签 + 词形本体） */
    .infl-list { display: flex; flex-direction: column; gap: 6px; }
    .infl-row { display: flex; align-items: baseline; gap: 10px; }
    .infl-label {
      flex-shrink: 0;
      min-width: 74px;
      font-size: 12px;
      color: var(--sub);
    }
    .infl-word {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", sans-serif;
    }
  </style>
</head>
<body>
  <header>
    <h1><img src="icons/icon48.png" class="logo-img" alt="" />奶娃过四级</h1>
    <div class="video-title" id="videoTitle">尚未捕获视频</div>
    <div class="capture-status" id="captureStatus" role="status" aria-live="polite">等待字幕状态</div>
    <details class="perf-diagnostics">
      <summary>本地阶段计时（当前后台进程）</summary>
      <div class="perf-diagnostics-content" id="perfMetrics">等待样本</div>
    </details>
  </header>

  <div class="vocabulary-picker">
    <div class="vocabulary-row">
      <label for="vocabularySelect">词库</label>
      <select id="vocabularySelect" disabled>
        <option value="cet4">四级</option>
        <option value="cet6">六级</option>
        <option value="ielts">雅思（社区学术词表）</option>
      </select>
      <a href="vocabulary-sources.html" target="_blank" rel="noopener">词表来源</a>
    </div>
    <div class="vocabulary-status" id="vocabularyStatus" role="status">正在加载词库…</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="current">当前视频</div>
    <div class="tab" data-tab="history">历史记录</div>
    <div class="tab" data-tab="familiar">已斩词</div>
  </div>

  <!-- 当前视频 tab -->
  <div id="tab-current">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="搜索单词或释义..." />
      <button class="btn btn-primary" id="recaptureBtn">重新抓取</button>
    </div>
    <div class="content" id="currentContent"></div>
  </div>

  <!-- 历史 tab -->
  <div id="tab-history" style="display:none;">
    <div class="content" id="historyContent"></div>
  </div>

  <!-- 已斩词 tab -->
  <div id="tab-familiar" style="display:none;">
    <div class="toolbar">
      <button class="btn btn-ghost" id="clearFamiliarBtn" title="清空三个词库共享的已斩词记录">清空所有斩词</button>
    </div>
    <div class="content" id="familiarContent"></div>
  </div>

  <!-- 单词详情弹窗 -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-box" id="detailBox"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
