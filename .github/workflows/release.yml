name: Release

# 打 tag（如 v1.2.0）时自动打包 zip，并创建 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（例如 v1.2.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 校验 manifest 与版本一致性
        run: |
          node -e "
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const tag='${{ github.event.inputs.tag || github.ref_name }}'.replace(/^v/,'');
          console.log('manifest version = ' + m.version + ' / tag version = ' + tag);
          if (m.version !== tag) {
            console.error('❌ manifest.json 里的 version (' + m.version + ') 与 tag (' + tag + ') 不一致，请先改 manifest 再打 tag');
            process.exit(1);
          }
          console.log('✅ 版本号一致');
          "

      - name: 打包扩展 zip
        run: |
          set -e
          VERSION=$(node -p "require('./manifest.json').version")
          NAME="naiwa-cet4-v${VERSION}"
          # 用打包清单脚本统一校验 + 复制，和本地 --check 用同一份清单，绝不漏文件
          node scripts/package-extension.js "dist/${NAME}"
          cd dist
          zip -r "${NAME}.zip" "${NAME}" -x ".*" -x "*/.*"
          rm -rf "${NAME}"
          echo "--- 包内文件 ---"
          unzip -l "${NAME}.zip"
          echo "ZIP_PATH=dist/${NAME}.zip" >> $GITHUB_ENV
          echo "ZIP_NAME=${NAME}.zip" >> $GITHUB_ENV

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 奶娃过四级 ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
          body: |
            ## 本次更新

            - 🎚️ **普通 / 测试双模式**：词库弹层顶部切「学习方式」，测试模式四选一记词，普通模式直接看释义
            - 🗂️ **三词库 + 自定义**：四级 4,590 / 六级 2,219 / 雅思 1,000，还能导入自己的词表（JSON / CSV / TSV / TXT）
            - 💾 **做题进度持久化**：退出、刷新、重进视频，停在原题，前后「已做 / 未做」状态都在
            - 🐞 **修「刷新后单词清零」**：此前刷新页面会把已抓的词覆盖掉，现已根治
            - 🚦 **采集状态条 + 诊断面板**：抓不到词时直接看到卡在哪一步
            - 📺 **标准字幕轨通道**：页面自带字幕轨也能抓（不依赖沉浸式翻译）
            - 🎲 **选项顺序固定**：同一个词每次打开选项位置都一样，不再乱跳

            ## 安装

            1. 下载下方的 `${{ env.ZIP_NAME }}` 并解压
            2. 打开 `chrome://extensions/`（Edge 为 `edge://extensions/`）
            3. 开启「开发者模式」→「加载已解压的扩展程序」→ 选择解压出的文件夹
            4. 打开视频页并让字幕持续播放

            > **⚠️ 一定要打开「沉浸式翻译」的双语字幕。**
            > 本扩展优先从这套双语字幕取词（只取英文原文那一行）；不开的话，
            > 靠 YouTube 原生字幕或页面标准字幕轨兜底，Netflix / B 站这类自绘字幕的平台基本抓不到词。

            > 本扩展**不上架任何商店**，只能按上面的方式手动加载。详见仓库 `README.md` 与 `docs/vocabulary-sources.html`。
