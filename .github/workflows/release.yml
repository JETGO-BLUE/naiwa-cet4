name: Release

# 打 tag（如 v1.2.0）时自动打包 zip，并创建 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（例如 v1.2.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 校验 manifest 与版本一致性
        run: |
          node -e "
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const tag='${{ github.event.inputs.tag || github.ref_name }}'.replace(/^v/,'');
          console.log('manifest version = ' + m.version + ' / tag version = ' + tag);
          if (m.version !== tag) {
            console.error('❌ manifest.json 里的 version (' + m.version + ') 与 tag (' + tag + ') 不一致，请先改 manifest 再打 tag');
            process.exit(1);
          }
          console.log('✅ 版本号一致');
          "

      - name: 打包扩展 zip
        run: |
          set -e
          VERSION=$(node -p "require('./manifest.json').version")
          NAME="naiwa-cet4-v${VERSION}"
          mkdir -p "dist/${NAME}"
          # 只把扩展运行必需的文件打进 zip
          cp manifest.json background.js content.js popup.html popup.js cet4_words.json quiz_bank.json "dist/${NAME}/"
          cp -r icons "dist/${NAME}/icons"
          # 必需文件一个都不能少（漏了会导致装上去功能残缺）
          for f in manifest.json background.js content.js popup.html popup.js cet4_words.json quiz_bank.json; do
            test -f "dist/${NAME}/${f}" || { echo "❌ 缺少必需文件: ${f}"; exit 1; }
          done
          test -f "dist/${NAME}/icons/icon128.png" || { echo "❌ 缺少图标"; exit 1; }
          echo "✅ 必需文件齐全"
          cd dist
          zip -r "${NAME}.zip" "${NAME}" -x ".*" -x "*/.*"
          rm -rf "${NAME}"
          echo "--- 包内文件 ---"
          unzip -l "${NAME}.zip"
          echo "ZIP_PATH=dist/${NAME}.zip" >> $GITHUB_ENV
          echo "ZIP_NAME=${NAME}.zip" >> $GITHUB_ENV

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 奶娃过四级 ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
          body: |
            ## 本次更新

            - 🎧 **四选一记词**：单词表不再直接给中文释义 —— 单击单词听发音，再从 4 个中文释义里选。
              选错在该选项旁标 **❌**，选对变绿并直接亮出它的中文释义
            - 🗂️ **本地题库**：4590 个词各配 3 个「形近 / 同词性 / 易混淆」干扰释义
              （`access` 配 `accent` / `actress` / `accuse`），**出题不联网**
            - 🔊 **点读发音**：用浏览器内置语音合成朗读英文，离线可用、无需额外权限
            - 🧭 **时间点改为每 3 分钟记一次**：显示为 `0:00 / 3:00 / 6:00…`，上限 10 个
            - 🗡️ **「斩」掉即从列表移除**：不再只是变灰，但仍可在「已斩词」页撤销

            ## 安装

            1. 下载下方的 `${{ env.ZIP_NAME }}` 并解压
            2. 打开 `chrome://extensions/`（Edge 为 `edge://extensions/`）
            3. 开启「开发者模式」→「加载已解压的扩展程序」→ 选择解压出的文件夹
            4. 打开视频页并让字幕持续播放

            > **⚠️ 一定要打开「沉浸式翻译」的双语字幕。**
            > 本扩展抓的词，就是从这套双语字幕里取的（只取英文原文那一行）。
            > 不开的话，除 YouTube 自带字幕外，Netflix / B站 这类平台基本抓不到词。

            > 本扩展**不上架任何商店**，只能按上面的方式手动加载。
